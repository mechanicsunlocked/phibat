name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip


      - name: Build
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: phibat
          path: build/phibat-*-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="build/phibat-${VERSION}-x64.zip"
          test -f "$ZIP" || { echo "Makefile VERSION does not match tag $GITHUB_REF_NAME"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "phibat $VERSION" --generate-notes
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/phibat-${VERSION}-x64.zip"
          sh tools/winget-manifests.sh "${GITHUB_REPOSITORY_OWNER}.phibat" "$VERSION" "$ZIP" "$URL" \
            "${GITHUB_REPOSITORY_OWNER}" "https://github.com/${GITHUB_REPOSITORY}"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: winget-manifests
          path: build/winget/
